<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Theme Interactive Course</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        line-height: 1.6;
        color: #333;
        background: #f5f5f5;
      }

      .container {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 0;
        min-height: 100vh;
      }

      aside {
        background: #1a1a1a;
        color: white;
        padding: 20px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 3px solid #007bff;
      }

      aside h3 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        color: #007bff;
      }

      aside ul {
        list-style: none;
      }

      aside li {
        margin-bottom: 8px;
      }

      aside a {
        color: #aaa;
        text-decoration: none;
        font-size: 13px;
        display: block;
        padding: 8px 12px;
        border-radius: 4px;
        transition: all 0.3s;
      }

      aside a:hover {
        background: #333;
        color: #007bff;
      }

      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #e0e0e0;
        z-index: 1000;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #007bff, #0056b3);
        width: 0%;
        transition: width 0.1s ease;
      }

      main {
        padding: 40px;
        background: white;
        overflow-y: auto;
      }

      .module {
        margin-bottom: 60px;
        padding-bottom: 40px;
        border-bottom: 1px solid #e0e0e0;
      }

      .module:last-child {
        border-bottom: none;
      }

      .module-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      .module-icon {
        font-size: 40px;
      }

      .module-header h2 {
        color: #007bff;
        font-size: 28px;
      }

      .section {
        margin-bottom: 25px;
      }

      h3 {
        color: #333;
        font-size: 18px;
        margin: 20px 0 10px 0;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f0f0;
      }

      p {
        margin-bottom: 15px;
        line-height: 1.8;
      }

      ul,
      ol {
        margin-left: 20px;
        margin-bottom: 15px;
      }

      li {
        margin-bottom: 8px;
      }

      code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "Fira Code", monospace;
        font-size: 13px;
        color: #d63384;
      }

      .code-block {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 15px 0;
        font-family: "Fira Code", monospace;
        font-size: 12px;
        border-left: 4px solid #007bff;
      }

      .code-block pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .explanation-box,
      .success-box,
      .warning-box {
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-left: 4px solid;
      }

      .explanation-box {
        background: #e3f2fd;
        border-color: #007bff;
        color: #0c3a66;
      }

      .success-box {
        background: #e8f5e9;
        border-color: #4caf50;
        color: #1b5e20;
      }

      .warning-box {
        background: #fff3cd;
        border-color: #ffc107;
        color: #856404;
      }

      .quiz-section {
        background: #f9f9f9;
        border: 2px solid #007bff;
        border-radius: 6px;
        padding: 20px;
        margin: 20px 0;
      }

      .quiz-question {
        font-weight: 600;
        margin-bottom: 15px;
        color: #333;
      }

      .quiz-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .quiz-option {
        display: flex;
        align-items: center;
        padding: 10px 15px;
        border: 2px solid #ddd;
        border-radius: 4px;
        background: white;
        cursor: pointer;
        transition: all 0.3s;
      }

      .quiz-option:hover {
        border-color: #007bff;
        background: #f0f8ff;
      }

      .quiz-option input {
        margin-right: 10px;
        cursor: pointer;
      }

      .quiz-option.selected {
        border-color: #007bff;
        background: #e3f2fd;
      }

      .quiz-feedback {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        font-weight: 500;
      }

      .feedback-correct {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .feedback-incorrect {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .scroll-top-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        z-index: 999;
      }

      .scroll-top-btn.show {
        opacity: 1;
        visibility: visible;
      }

      .scroll-top-btn:hover {
        background: #0056b3;
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0, 123, 255, 0.4);
      }

      strong {
        color: #007bff;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
          height: auto;
          max-height: 300px;
          border-right: none;
          border-bottom: 3px solid #007bff;
        }

        main {
          padding: 20px;
        }

        .module-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .scroll-top-btn {
          bottom: 20px;
          right: 20px;
          width: 40px;
          height: 40px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="container">
      <aside>
        <h3>📚 Contents</h3>
        <ul id="tocList"></ul>
      </aside>

      <main id="mainContent"></main>
    </div>

    <button class="scroll-top-btn" id="scrollTopBtn">↑</button>

    <script>
      const modules = [
        {

          title: "Introduction & Architecture",
          sections: [
            {
              type: "text",
              content:
                "This interactive course teaches you everything about this professional WordPress theme in 45+ minutes. You'll understand the complete system from PHP configuration to JavaScript modules to Twig templates.",
            },
            {
              type: "heading",
              content: "What You'll Learn",

            {
              type: "list",
              items: [
                "Theme initialization and WordPress hooks",

            {
              type: "text",

                "Actions let you execute custom code at specific points. Example from functions.php:",

            {
              type: "code",

            {
              type: "heading",
              content: "Filters",
            },
            {
              type: "text",
              content:
                "Filters modify data and return the changed value. Example adding accessibility IDs to form fields:",
            },
            {
              type: "code",
              language: "php",
              content:
                "add_filter('wpcf7_form_elements', function($html) {" +
                "\n" +
                "    // Add IDs to inputs for accessibility" +
                "\n" +
                "    return $modified_html;" +
                "\n" +
                "});",
            },
          ],
        },
        {
          id: "js-modules",
          icon: "📦",
          title: "JavaScript Module Architecture",
          sections: [
            {
              type: "text",
              content:
                "The theme uses ES6 modules to organize JavaScript into independent, reusable pieces. Each module has a single responsibility.",
            },
            {
              type: "heading",
              content: "Key Modules",
            },
            {
              type: "list",
              items: [
                "cart.js - Shopping cart functionality",
                "search.js - Search interface and results",
                "forms.js - Form initialization and validation",
                "theme-toggle.js - Light/dark mode switching",
                "cookie-consent.js - GDPR compliance",
              ],
            },
            {
              type: "heading",
              content: "Module Pattern",
            },
            {
              type: "code",
              language: "javascript",
              content:
                "const ThemeToggle = {" +
                "\n" +
                "    init() {" +
                "\n" +
                "        document.addEventListener('DOMContentLoaded', () => {" +
                "\n" +
                "            this.setupThemeToggle();" +
                "\n" +
                "        });" +
                "\n" +
                "    }" +
                "\n" +
                "};" +
                "\n" +
                "export default ThemeToggle;",
            },
            {
              type: "explanation",
              content:
                "Each module exports a single object with an init() method that's called when the DOM is ready. This ensures modules load in a predictable order.",
            },
          ],
        },
        {
          id: "config",
          icon: "⚙️",
          title: "Configuration System",
          sections: [
            {
              type: "heading",
              content: "Theme_Config Class",
            },
            {
              type: "text",
              content:
                "All theme configuration is centralized in the Theme_Config static class, providing a single source of truth for settings across the entire theme.",
            },
            {
              type: "heading",
              content: "Accessing Configuration",
            },
            {
              type: "code",
              language: "php",
              content:
                "use Starter_Theme\\\\Config\\\\Theme_Config;" +
                "\n" +
                "\n" +
                "$is_dark_mode_enabled = Theme_Config::get('features.dark_mode');" +
                "\n" +
                "$lazy_load_images = Theme_Config::get('features.lazy_loading');",
            },
            {
              type: "heading",
              content: "Feature Flags",
            },
            {
              type: "text",
              content:
                "You can enable or disable features by setting values in config.php. This makes it easy to customize the theme without touching code logic.",
            },
            {
              type: "success",
              content:
                "Pro Tip: Use Theme_Config to add your own custom settings and access them consistently throughout the theme.",
            },
          ],
        },
        {
          id: "blocks",
          icon: "🧩",
          title: "Custom Gutenberg Blocks",
          sections: [
            {
              type: "heading",
              content: "Block Registration",
            },
            {
              type: "text",
              content:
                "The theme includes custom Gutenberg blocks registered via block.json files. Each block has its own directory with configuration and rendering logic.",
            },
            {
              type: "heading",
              content: "Block Structure",
            },
            {
              type: "code",
              language: "json",
              content:
                "{" +
                "\n" +
                '  "name": "starter-theme/hero",' +
                "\n" +
                '  "title": "Hero Section",' +
                "\n" +
                '  "category": "design",' +
                "\n" +
                '  "supports": {' +
                "\n" +
                '    "html": false,' +
                "\n" +
                '    "align": true' +
                "\n" +
                "  }" +
                "\n" +
                "}",
            },
            {
              type: "heading",
              content: "Rendering with PHP",
            },
            {
              type: "text",
              content:
                "Blocks are rendered using PHP templates that receive attributes and content from the block editor.",
            },
            {
              type: "explanation",
              content:
                "Custom blocks let you create reusable content components that editors can use without touching code.",
            },
          ],
        },
        {
          id: "dark-mode",
          icon: "🌙",
          title: "Dark Mode Implementation",
          sections: [
            {
              type: "heading",
              content: "Complete Dark Mode System",
            },
            {
              type: "text",
              content:
                "The theme implements a complete dark mode using CSS variables and localStorage to remember user preference.",
            },
            {
              type: "heading",
              content: "Step 1: Theme Detection Script",
            },
            {
              type: "text",
              content:
                "This script runs in the document head to prevent flash of unstyled content:",
            },
            {
              type: "code",
              language: "html",
              content:
                "<!-- Runs BEFORE page renders to prevent flash -->" +
                "\n" +
                "<" +
                "script>" +
                "\n" +
                "    const stored = localStorage.getItem('theme-preference');" +
                "\n" +
                "    if (stored === 'light' || stored === 'dark') {" +
                "\n" +
                "        document.documentElement.setAttribute('data-theme', stored);" +
                "\n" +
                "    }" +
                "\n" +
                "<" +
                "/script>",
            },
            {
              type: "heading",
              content: "Step 2: CSS Variables",
            },
            {
              type: "code",
              language: "css",
              content:
                ":root {" +
                "\n" +
                "    --primary: #007bff;" +
                "\n" +
                "    --background: #ffffff;" +
                "\n" +
                "}" +
                "\n" +
                "\n" +
                'html[data-theme="dark"] {' +
                "\n" +
                "    --primary: #0056b3;" +
                "\n" +
                "    --background: #1a1a1a;" +
                "\n" +
                "}",
            },
            {
              type: "heading",
              content: "Step 3: Toggle Implementation",
            },
            {
              type: "code",
              language: "javascript",
              content:
                "function toggleTheme() {" +
                "\n" +
                "    const current = document.documentElement.getAttribute('data-theme');" +
                "\n" +
                "    const next = current === 'dark' ? 'light' : 'dark';" +
                "\n" +
                "    document.documentElement.setAttribute('data-theme', next);" +
                "\n" +
                "    localStorage.setItem('theme-preference', next);" +
                "\n" +
                "}",
            },
            {
              type: "success",
              content:
                "The theme preference persists across sessions, and the detection script prevents any visible flash.",
            },
          ],
        },
        {
          id: "performance",
          icon: "⚡",
          title: "Performance & Lazy Loading",
          sections: [
            {
              type: "heading",
              content: "Intersection Observer API",
            },
            {
              type: "text",
              content:
                "The theme uses the Intersection Observer API to lazy load images only when they come into view.",
            },
            {
              type: "heading",
              content: "Implementation Pattern",
            },
            {
              type: "code",
              language: "javascript",
              content:
                "const imageObserver = new IntersectionObserver((entries) => {" +
                "\n" +
                "    entries.forEach(entry => {" +
                "\n" +
                "        if (entry.isIntersecting) {" +
                "\n" +
                "            const img = entry.target;" +
                "\n" +
                "            img.src = img.dataset.src;" +
                "\n" +
                "            imageObserver.unobserve(img);" +
                "\n" +
                "        }" +
                "\n" +
                "    });" +
                "\n" +
                "});",
            },
            {
              type: "heading",
              content: "HTML Usage",
            },
            {
              type: "code",
              language: "html",
              content:
                "<" +
                'img data-src="image.jpg" src="placeholder.jpg" alt="Description" />',
            },
            {
              type: "explanation",
              content:
                "Lazy loading defers image loading until they're needed, reducing initial page load time significantly.",
            },
          ],
        },
        {
          id: "styling",
          icon: "🎨",
          title: "Styling & CSS System",
          sections: [
            {
              type: "heading",
              content: "BEM Naming Convention",
            },
            {
              type: "text",
              content:
                "The theme uses BEM (Block, Element, Modifier) for consistent, maintainable CSS naming.",
            },
            {
              type: "heading",
              content: "BEM Pattern",
            },
            {
              type: "code",
              language: "css",
              content:
                "/* Block */" +
                "\n" +
                ".card { }" +
                "\n" +
                "\n" +
                "/* Element */" +
                "\n" +
                ".card__header { }" +
                "\n" +
                ".card__body { }" +
                "\n" +
                "\n" +
                "/* Modifier */" +
                "\n" +
                ".card--featured { }" +
                "\n" +
                ".card__header--dark { }",
            },
            {
              type: "heading",
              content: "SCSS Organization",
            },
            {
              type: "list",
              items: [
                "css/inc/base/ - Reset and typography",
                "css/inc/components/ - Reusable components",
                "css/inc/pages/ - Page-specific styles",
                "css/inc/utilities/ - Utility classes",
                "css/inc/global/ - Global variables and mixins",
              ],
            },
            {
              type: "explanation",
              content:
                "This structure makes it easy to find and maintain styles as the theme grows.",
            },
          ],
        },
        {
          id: "workflow",
          icon: "🛠️",
          title: "Development Workflow",
          sections: [
            {
              type: "heading",
              content: "Build Tools",
            },
            {
              type: "text",
              content:
                "The theme uses Vite for fast development and optimized production builds.",
            },
            {
              type: "heading",
              content: "Available Commands",
            },
            {
              type: "code",
              language: "bash",
              content:
                "npm run dev        # Start development server" +
                "\n" +
                "npm run build      # Create production build" +
                "\n" +
                "npm run preview    # Preview production build" +
                "\n" +
                "npm run lint       # Check code quality",
            },
            {
              type: "heading",
              content: "Development Tips",
            },
            {
              type: "list",
              items: [
                "Use npm run dev for hot module reloading",
                "Check linter output before committing",
                "Test across browsers before deployment",
                "Use source maps for debugging",
              ],
            },
          ],
        },
        {
          id: "integration",
          icon: "🔗",
          title: "Complete Integration Pattern",
          sections: [
            {
              type: "heading",
              content: "Page Request Lifecycle",
            },
            {
              type: "text",
              content: "Here's how a request flows through the theme:",
            },
            {
              type: "list",
              items: [
                "WordPress loads functions.php and registers hooks",
                "Template file (page.php, single.php, etc) is selected",
                "Theme_Config provides centralized settings",

                "User interactions trigger module functions",
              ],
            },
            {
              type: "heading",
              content: "Example: Adding a Feature",

            {
              type: "list",
              items: [

                "2. Check config in PHP: Theme_Config::get('features.my_feature')",
                "3. Create JavaScript module if needed",
                "4. Update Twig template to use new functionality",

            {
              type: "success",

        {

          sections: [

            {

        {

            {

            {
              type: "quiz",
              question:
                "How do JavaScript modules communicate with each other?",
              options: [

                  text: "Through custom DOM events and localStorage",

                  text: "By directly calling each other's functions",

              feedback: {

            {
              type: "heading",
              content: "Question 3: Dark Mode",
            },
            {

              feedback: {

                  "✓ Correct! Early execution prevents the visual 'flash' when theme preference loads.",
                incorrect:
                  "✗ Not quite. The timing is crucial to prevent color flashing.",
              },
            },
            {
              type: "success",
              content:
                "Congratulations! You now understand this WordPress theme architecture. Continue learning and building amazing projects!",
            },
          ],
        },
      ];

      function renderCourse() {
        const container = document.getElementById("mainContent");
        const toc = document.getElementById("tocList");

        modules.forEach((module) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#" + module.id;
          a.textContent = module.icon + " " + module.title;
          a.onclick = (e) => {
            e.preventDefault();
            document
              .getElementById(module.id)
              .scrollIntoView({ behavior: "smooth" });
          };
          li.appendChild(a);
          toc.appendChild(li);

          const div = document.createElement("div");
          div.className = "module";
          div.id = module.id;

          const header = document.createElement("div");
          header.className = "module-header";
          header.innerHTML =
            '<div class="module-icon">' +
            module.icon +
            "</div><h2>" +
            module.title +
            "</h2>";
          div.appendChild(header);

          module.sections.forEach((section) => {
            const sectionDiv = document.createElement("div");
            sectionDiv.className = "section";

            if (section.type === "heading") {
              const h3 = document.createElement("h3");
              h3.textContent = section.content;
              sectionDiv.appendChild(h3);
            } else if (section.type === "text") {
              const p = document.createElement("p");
              p.innerHTML = section.content;
              sectionDiv.appendChild(p);
            } else if (section.type === "list") {
              const ul = document.createElement("ul");
              section.items.forEach((item) => {
                const li = document.createElement("li");
                li.textContent = item;
                ul.appendChild(li);
              });
              sectionDiv.appendChild(ul);
            } else if (section.type === "code") {
              const codeBlock = document.createElement("div");
              codeBlock.className = "code-block";
              const pre = document.createElement("pre");
              pre.textContent = section.content;
              codeBlock.appendChild(pre);
              sectionDiv.appendChild(codeBlock);
            } else if (section.type === "explanation") {
              const box = document.createElement("div");
              box.className = "explanation-box";
              box.innerHTML = section.content;
              sectionDiv.appendChild(box);
            } else if (section.type === "success") {
              const box = document.createElement("div");
              box.className = "success-box";
              box.innerHTML = section.content;
              sectionDiv.appendChild(box);
            } else if (section.type === "warning") {
              const box = document.createElement("div");
              box.className = "warning-box";
              box.innerHTML = section.content;
              sectionDiv.appendChild(box);
            } else if (section.type === "quiz") {
              const quizDiv = document.createElement("div");
              quizDiv.className = "quiz-section";

              const question = document.createElement("div");
              question.className = "quiz-question";
              question.textContent = section.question;
              quizDiv.appendChild(question);

              const optionsDiv = document.createElement("div");
              optionsDiv.className = "quiz-options";

              section.options.forEach((option, idx) => {
                const optionDiv = document.createElement("div");
                optionDiv.className = "quiz-option";

                const input = document.createElement("input");
                input.type = "radio";
                input.name =
                  "quiz-" + module.id + "-" + section.question.substring(0, 10);
                input.value = idx;
                input.id = "opt-" + module.id + "-" + idx;

                const label = document.createElement("label");
                label.htmlFor = "opt-" + module.id + "-" + idx;
                label.textContent = option.text;
                label.style.cursor = "pointer";
                label.style.flex = "1";

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);

                optionDiv.onclick = () => {
                  document
                    .querySelectorAll('input[name="' + input.name + '"]')
                    .forEach((r) => {
                      r.parentElement.classList.remove("selected");
                    });
                  input.checked = true;
                  optionDiv.classList.add("selected");

                  const feedback = quizDiv.querySelector(".quiz-feedback");
                  if (feedback) feedback.remove();

                  const feedbackDiv = document.createElement("div");
                  feedbackDiv.className =
                    "quiz-feedback" +
                    (option.correct
                      ? " feedback-correct"
                      : " feedback-incorrect");
                  feedbackDiv.textContent = option.correct
                    ? section.feedback.correct
                    : section.feedback.incorrect;
                  quizDiv.appendChild(feedbackDiv);
                };

                optionsDiv.appendChild(optionDiv);
              });

              quizDiv.appendChild(optionsDiv);
              sectionDiv.appendChild(quizDiv);
            }

            div.appendChild(sectionDiv);
          });

          container.appendChild(div);
        });
      }

      function updateProgressBar() {
        const scrollTop = window.scrollY;
        const docHeight =
          document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;

        document.querySelector(".progress-fill").style.width =
          scrollPercent + "%";

        const btn = document.getElementById("scrollTopBtn");
        if (scrollTop > 300) {
          btn.classList.add("show");
        } else {
          btn.classList.remove("show");
        }
      }

      document.getElementById("scrollTopBtn").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      renderCourse();
      window.addEventListener("scroll", updateProgressBar);
    </script>
  </body>
</html>
